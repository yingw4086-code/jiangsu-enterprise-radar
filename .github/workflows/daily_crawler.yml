name: Daily government crawler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 18:00 UTC = 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  daily-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily crawler
        run: python -m crawler.run_daily --min-records 1

      - name: Upload crawler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-log
          path: logs/crawler.log
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/enterprise.db
          find data/ai -name "financing_analysis_daily_*.json" -print0 | xargs -0 -r git add
          find data/ai -name "financing_analysis_license_*.json" -print0 | xargs -0 -r git add
          find data/opportunities -name "enterprise_opportunities_daily_*.json" -print0 | xargs -0 -r git add
          find data/licenses -name "construction_permits_*.json" -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily crawler data"
            git push
          else
            echo "No data changes to commit."
          fi
